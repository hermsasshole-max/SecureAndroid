name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'APK variant to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Capacitor Sync & Gradle APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--no-deprecation'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run cybersecurity unit tests
        run: npm test

      - name: Run TypeScript type check
        run: npm run lint

      - name: Build Vite production bundle, verify Android binaries & sync Capacitor
        run: |
          npm run build
          node scripts/prepare-android-ci.mjs
          npx cap sync android

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          printf "sdk.dir=%s\n" "$SDK_ROOT" > android/local.properties

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" >/dev/null || true
          fi

          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ]; then
            echo "Upgrading Android SDK command-line tools to latest release..."
            mkdir -p /tmp/android-cmdtools "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o /tmp/android-cmdtools/tools.zip
            unzip -o -q /tmp/android-cmdtools/tools.zip -d /tmp/android-cmdtools
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/android-cmdtools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
            yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" >/dev/null
          fi

          ls -lh "$SDK_ROOT/platforms/android-36/android.jar"

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode optional Release Keystore from GitHub Secrets
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/aegis-release.jks"
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ (inputs.build_variant || github.event.inputs.build_variant || 'both') != 'release' }}
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        if: ${{ (inputs.build_variant || github.event.inputs.build_variant || 'both') != 'debug' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Collect built APKs into dist-apk/
        run: |
          mkdir -p dist-apk
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/AegisLocal-debug.apk
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist-apk/AegisLocal-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist-apk/AegisLocal-release-unsigned.apk
          fi
          ls -lh dist-apk/

      - name: Upload Debug APK Artifact
        if: ${{ (inputs.build_variant || github.event.inputs.build_variant || 'both') != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: AegisLocal-Debug-APK
          path: dist-apk/AegisLocal-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK Artifact
        if: ${{ (inputs.build_variant || github.event.inputs.build_variant || 'both') != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: AegisLocal-Release-APK
          path: dist-apk/AegisLocal-release*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish APKs to GitHub Release (on v* tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          generate_release_notes: true
